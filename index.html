<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Calculadora web</title> <style> body { font-family: Arial; background: #eef3f8; text-align: center; padding: 40px 15px; } .caja { background: white; max-width: 360px; margin: auto; padding: 24px; border-radius: 12px; } input, select, button { box-sizing: border-box; width: 100%; padding: 10px; margin: 7px 0; } button { background: #2471a3; color: white; border: 0; border-radius: 6px; } #resultado { font-weight: bold; } </style> </head> <body> <div class="caja"> <h1>Calculadora web</h1> <p>Escribe dos números y elige una operación.</p> <input id="numero1" type="number" placeholder="Primer número"> <select id="operacion"> <option value="sumar">Suma (+)</option> <option value="restar">Resta (-)</option> <option value="multiplicar">Multiplicación (×)</option> <option value="dividir">División (÷)</option> </select> <input id="numero2" type="number" placeholder="Segundo número"> <button onclick="calcular()">Calcular</button> <p id="resultado">Resultado: </p> </div> <script src="calculadora.js"></script> </body> </html>
